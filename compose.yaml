# Local development infrastructure.
#   pnpm infra:up        start postgres, redis and mailpit
#   docker compose --profile app up --build    also run the api and web containers
name: shikkhacore

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      SHIKKHACORE_OWNER_PASSWORD: ${SHIKKHACORE_OWNER_PASSWORD:-owner_dev_password}
      SHIKKHACORE_APP_PASSWORD: ${SHIKKHACORE_APP_PASSWORD:-app_dev_password}
      SHIKKHACORE_SYSTEM_PASSWORD: ${SHIKKHACORE_SYSTEM_PASSWORD:-system_dev_password}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      # Postgres 18 images keep data in a version-specific directory below this mount.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/sql:/opt/shikkhacore/sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shikkhacore']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # Optional containerised application (profile: app)
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: migrate
    environment:
      MIGRATION_DATABASE_URL: postgresql://shikkhacore_owner:${SHIKKHACORE_OWNER_PASSWORD:-owner_dev_password}@postgres:5432/shikkhacore
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://shikkhacore_app:${SHIKKHACORE_APP_PASSWORD:-app_dev_password}@postgres:5432/shikkhacore
      SYSTEM_DATABASE_URL: postgresql://shikkhacore_system:${SHIKKHACORE_SYSTEM_PASSWORD:-system_dev_password}@postgres:5432/shikkhacore
      REDIS_URL: redis://redis:6379/0
      APP_PUBLIC_URL: http://localhost:3100
      APP_BASE_DOMAIN: localhost
      APP_ROOT_HOSTS: localhost
      APP_PLATFORM_HOSTS: admin.localhost
      TRUST_PROXY: uniquelocal
      COOKIE_SECURE: 'false'
      SESSION_COOKIE_NAME: sc_session
      MAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: ShikkhaCore <no-reply@shikkhacore.local>
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:4000:4000'

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      PORT: '3100'
      API_PROXY_TARGET: http://api:4000
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api
    ports:
      - '127.0.0.1:3100:3100'

volumes:
  postgres-data:
  redis-data:
